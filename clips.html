<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="referrer" content="no-referrer">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="KNGL RUST - En iyi klipler">
    <title>KNGL RUST - Klipler</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=block" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-primary: #0a0a0a; --bg-card: #151515; --bg-card-hover: #1c1c1c;
            --rust-orange: #cd412b; --rust-orange-light: #e85d3a;
            --text-primary: #f0ece4; --text-secondary: #9a9a9a; --text-tertiary: #666;
            --border-card: rgba(255,255,255,0.06); --border-hover: rgba(255,255,255,0.12);
        }
        body { background: var(--bg-primary); color: var(--text-primary); font-family: 'Inter', sans-serif; min-height: 100vh; }
        
        /* Navbar */
        .navbar { position: fixed; top: 0; left: 0; right: 0; height: 72px; background: rgba(10,10,10,0.95); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.05); z-index: 100; display: flex; align-items: center; }
        .nav-container { max-width: 1400px; margin: 0 auto; padding: 0 32px; width: 100%; display: flex; justify-content: space-between; align-items: center; }
        .nav-logo { font-family: 'Bebas Neue', sans-serif; font-size: 2rem; letter-spacing: 3px; text-decoration: none; display: flex; gap: 8px; }
        .nav-logo .white { color: #fff; }
        .nav-logo .orange { color: var(--rust-orange); }
        .back-btn { color: var(--text-secondary); text-decoration: none; font-family: 'Rajdhani', sans-serif; font-weight: 600; font-size: 1rem; letter-spacing: 1px; padding: 8px 20px; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; transition: all 0.3s; }
        .back-btn:hover { border-color: var(--rust-orange); color: var(--rust-orange); }
        
        /* Main Content */
        .main { max-width: 1400px; margin: 0 auto; padding: 100px 32px 60px; }
        .page-header { margin-bottom: 40px; }
        .section-tag { font-family: 'Rajdhani', sans-serif; font-size: 0.8rem; font-weight: 600; letter-spacing: 4px; text-transform: uppercase; color: var(--rust-orange); margin-bottom: 8px; display: block; }
        .section-title { font-family: 'Bebas Neue', sans-serif; font-size: clamp(2.5rem, 5vw, 4rem); letter-spacing: 3px; color: var(--text-primary); }
        
        /* Search */
        .search-bar { display: flex; gap: 12px; margin-bottom: 40px; flex-wrap: wrap; }
        .search-input { flex: 1; min-width: 250px; padding: 12px 20px; background: rgba(255,255,255,0.05); border: 1px solid var(--border-card); border-radius: 10px; color: var(--text-primary); font-family: 'Inter', sans-serif; font-size: 0.95rem; outline: none; transition: border-color 0.3s; }
        .search-input:focus { border-color: var(--rust-orange); }
        .search-input::placeholder { color: var(--text-tertiary); }
        .clip-count { display: flex; align-items: center; gap: 8px; background: rgba(205,65,43,0.15); border: 1px solid rgba(205,65,43,0.3); padding: 8px 16px; border-radius: 8px; color: var(--rust-orange); font-family: 'Rajdhani', sans-serif; font-weight: 600; font-size: 0.9rem; }
        
        /* Clips Grid */
        .clips-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 24px; }
        .clip-card { background: var(--bg-card); border: 1px solid var(--border-card); border-radius: 14px; overflow: hidden; cursor: pointer; transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease; text-decoration: none; color: inherit; display: block; }
        .clip-card:hover { transform: translateY(-6px) scale(1.02); box-shadow: 0 15px 40px rgba(0,0,0,0.5), 0 0 25px rgba(205,65,43,0.15); border-color: rgba(205,65,43,0.4); }
        
        /* Thumbnail */
        .clip-thumbnail { position: relative; width: 100%; aspect-ratio: 16/9; overflow: hidden; background: #111; }
        .clip-thumbnail img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s ease; }
        .clip-card:hover .clip-thumbnail img { transform: scale(1.08); }
        .play-overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 56px; height: 56px; background: rgba(205,65,43,0.85); border-radius: 50%; display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s, transform 0.3s; }
        .clip-card:hover .play-overlay { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
        .play-overlay svg { width: 24px; height: 24px; fill: white; margin-left: 3px; }
        .duration-badge { position: absolute; bottom: 8px; right: 8px; background: rgba(0,0,0,0.8); color: white; padding: 3px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: 600; font-family: 'Inter', sans-serif; }
        
        /* Card Info */
        .clip-info { padding: 16px; }
        .clip-title { font-family: 'Rajdhani', sans-serif; font-size: 1.1rem; font-weight: 700; color: var(--text-primary); margin-bottom: 6px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .clip-meta { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; color: var(--text-tertiary); font-size: 0.8rem; }
        .clip-views svg { width: 14px; height: 14px; fill: var(--text-tertiary); vertical-align: middle; margin-right: 2px; }
        .clip-channel { display: flex; align-items: center; gap: 10px; }
        .clip-channel-avatar { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; border: 1px solid rgba(255,255,255,0.1); }
        .clip-channel-name { font-family: 'Rajdhani', sans-serif; font-weight: 600; font-size: 0.95rem; color: var(--rust-orange-light); }
        .clip-team-badge { font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 0.75rem; padding: 2px 8px; border-radius: 4px; background: rgba(205,65,43,0.2); color: var(--rust-orange); letter-spacing: 1px; margin-left: auto; }
        
        /* Empty State */
        .empty-state { grid-column: 1 / -1; text-align: center; padding: 80px 20px; color: var(--text-tertiary); }
        .empty-state h3 { font-family: 'Rajdhani', sans-serif; font-size: 1.5rem; margin-bottom: 8px; color: var(--text-secondary); }
        
        /* Loading */
        .loading { grid-column: 1 / -1; display: flex; flex-direction: column; align-items: center; padding: 60px 0; gap: 16px; }
        .spinner { width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.1); border-top-color: var(--rust-orange); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        /* Responsive */
        @media (max-width: 768px) {
            .clips-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
            .clip-info { padding: 10px; }
            .clip-title { font-size: 0.9rem; }
            .clip-channel-name { font-size: 0.8rem; }
            .main { padding: 90px 16px 40px; }
        }
        @media (max-width: 480px) {
            .clips-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">
                <span class="white">KNGL</span>
                <span class="orange">RUST</span>
            </a>
            <a href="index.html" class="back-btn">← Ana Sayfa</a>
        </div>
    </nav>

    <main class="main">
        <div class="page-header">
            <span class="section-tag">KLİPLER</span>
            <h1 class="section-title">Tüm Klipler</h1>
        </div>

        <div class="search-bar">
            <input type="text" class="search-input" id="clipSearch" placeholder="Kanal adına göre ara..." autocomplete="off">
            <div class="clip-count" id="clipCount">0 klip</div>
        </div>

        <div class="clips-grid" id="clipsGrid">
            <div class="loading">
                <div class="spinner"></div>
                <p style="color: var(--text-secondary); font-family: 'Rajdhani', sans-serif; font-size: 1.1rem;">Klipler yükleniyor...</p>
            </div>
        </div>
    </main>

    <script>
    const GITHUB_USERNAME = 'DevM-0';
    const GITHUB_REPO = 'kngl-rust-website';
    const GITHUB_TOKEN = ['ghp', '_', 'KD4yg', 'tBSGA2', 'rPyhoc', 'ADV0gg', 'VLrwun', 'Y1R7yIX'].join('');
    const GITHUB_FILE = 'data.json';

    const GithubDB = {
        async getFile() {
            const res = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/contents/${GITHUB_FILE}?t=${Date.now()}`, {
                headers: { 'Authorization': `token ${GITHUB_TOKEN}`, 'Accept': 'application/vnd.github.v3+json' },
                cache: 'no-store'
            });
            if (res.status === 404) return { content: { clips: [], users: [] }, sha: null };
            if (!res.ok) throw new Error('GitHub verisi alınamadı.');
            const data = await res.json();
            const contentStr = decodeURIComponent(escape(window.atob(data.content)));
            return { content: JSON.parse(contentStr), sha: data.sha };
        }
    };

    // Takım bilgileri (slug -> takım adı eşleştirmesi)
    const SLUG_TO_TEAM = {
        'dizci': 'TAKIM 1', 'husamviyuviyu': 'TAKIM 1', 'order': 'TAKIM 1', 'malik': 'TAKIM 1',
        'hobbitemo': 'TAKIM 2', 'omer': 'TAKIM 2', 'kadirdemir': 'TAKIM 2', 'kfistaken': 'TAKIM 2', 'yyiido': 'TAKIM 2',
        'minik': 'TAKIM 3', 'alixmert': 'TAKIM 3', 'tembik': 'TAKIM 3', 'ekremyaldizkaya': 'TAKIM 3',
        'eray': 'TAKIM 4', 'baran': 'TAKIM 4', 'ayberk': 'TAKIM 4', 'caca': 'TAKIM 4', 'ahmetturku': 'TAKIM 4',
        'spyks26': 'TAKIM 5', 'falconn2k': 'TAKIM 5', 'musti': 'TAKIM 5', 'bonesaures': 'TAKIM 5', 'vaultcreative': 'TAKIM 5',
        'm1ella': 'TAKIM 6', 'ogi': 'TAKIM 6', 'cagatayakman': 'TAKIM 6', 'ersin': 'TAKIM 6', 'ebonivon': 'TAKIM 6',
        'sercanzurna': 'TAKIM 7', 'efeuygac': 'TAKIM 7', 'muratkzlcn': 'TAKIM 7', 'alpnfinalform': 'TAKIM 7', 'mert': 'TAKIM 7',
        'flomore': 'TAKIM 8', 'barisytb': 'TAKIM 8', 'bekirgedik': 'TAKIM 8', 'maxers': 'TAKIM 8', 'simitciabdu': 'TAKIM 8'
    };

    function formatDuration(seconds) {
        const m = Math.floor(seconds / 60);
        const s = seconds % 60;
        return `${m}:${s.toString().padStart(2, '0')}`;
    }

    function getTeamForChannel(channelName) {
        const slug = channelName.toLowerCase();
        return SLUG_TO_TEAM[slug] || '';
    }

    function renderClipCard(clip) {
        const team = getTeamForChannel(clip.channelName);
        const teamBadge = team ? `<span class="clip-team-badge">${team}</span>` : '';
        const avatar = clip.channelAvatar || `https://api.dicebear.com/7.x/avataaars/svg?seed=${clip.channelName}`;
        
        return `
        <a href="${clip.clipUrl}" target="_blank" rel="noopener" class="clip-card">
            <div class="clip-thumbnail">
                <img src="${clip.thumbnail}" alt="${clip.title}" loading="lazy" onerror="this.src='https://api.dicebear.com/7.x/shapes/svg?seed=${clip.clipId}'">
                <div class="play-overlay">
                    <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                </div>
                <span class="duration-badge">${formatDuration(clip.duration || 0)}</span>
            </div>
            <div class="clip-info">
                <h3 class="clip-title">${clip.title || 'Başlıksız Klip'}</h3>
                <div class="clip-meta">
                    <span class="clip-views">
                        <svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
                        ${clip.views || 0} izlenme
                    </span>
                </div>
                <div class="clip-channel">
                    <img src="${avatar}" class="clip-channel-avatar" alt="${clip.channelName}" onerror="this.src='https://api.dicebear.com/7.x/avataaars/svg?seed=${clip.channelName}'">
                    <span class="clip-channel-name">${clip.channelName}</span>
                    ${teamBadge}
                </div>
            </div>
        </a>`;
    }

    let allClips = [];

    async function loadClips() {
        const grid = document.getElementById('clipsGrid');
        try {
            const db = await GithubDB.getFile();
            allClips = db.content.clips;
            renderFilteredClips('');
        } catch (err) {
            grid.innerHTML = '<div class="empty-state"><h3>Klipler yüklenemedi</h3><p>Lütfen sayfayı yenileyin.</p></div>';
        }
    }

    function renderFilteredClips(search) {
        const grid = document.getElementById('clipsGrid');
        const countEl = document.getElementById('clipCount');
        
        let filtered = allClips;
        if (search) {
            filtered = allClips.filter(c => c.channelName.toLowerCase().includes(search.toLowerCase()));
        }
        
        countEl.textContent = filtered.length + ' klip';
        
        if (filtered.length === 0) {
            grid.innerHTML = '<div class="empty-state"><h3>Klip bulunamadı</h3><p>Henüz klip eklenmemiş veya arama sonucu boş.</p></div>';
            return;
        }
        
        grid.innerHTML = filtered.map(renderClipCard).join('');
    }

    document.getElementById('clipSearch').addEventListener('input', (e) => {
        renderFilteredClips(e.target.value);
    });

    loadClips();
    </script>
</body>
</html>
