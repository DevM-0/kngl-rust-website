<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KNGL RUST - Admin Panel</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600&family=Rajdhani:wght@500;600;700&display=block" rel="stylesheet">
    
    <!-- Main Style -->
    <link rel="stylesheet" href="style.css?v=5">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --rust-orange: #cd412b;
            --rust-orange-hover: #b03623;
            --dark-bg: #0a0a0a;
            --card-bg: rgba(20, 20, 22, 0.9);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Login Screen */
        #loginScreen {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .login-logo {
            font-family: 'Bebas Neue', cursive;
            font-size: 3rem;
            color: var(--rust-orange);
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .login-title {
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.5rem;
            margin-bottom: 30px;
            color: var(--text-muted);
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .input-control {
            width: 100%;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px 15px;
            color: white;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        .input-control:focus {
            outline: none;
            border-color: var(--rust-orange);
            box-shadow: 0 0 0 2px rgba(205, 65, 43, 0.2);
        }

        .btn {
            background-color: var(--rust-orange);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 12px 20px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:hover {
            background-color: var(--rust-orange-hover);
        }

        .btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .error-msg {
            color: #ff4d4d;
            font-size: 0.9rem;
            margin-top: 15px;
            min-height: 20px;
        }

        /* Dashboard */
        #adminDashboard {
            display: none;
            flex-direction: column;
            min-height: 100vh;
        }

        .top-bar {
            background: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .top-logo {
            font-family: 'Bebas Neue', cursive;
            font-size: 2rem;
            color: var(--rust-orange);
            letter-spacing: 1px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .role-badge {
            font-size: 0.8rem;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .role-owner { background-color: rgba(255, 215, 0, 0.2); color: #ffd700; border: 1px solid rgba(255, 215, 0, 0.5); }
        .role-admin { background-color: rgba(205, 65, 43, 0.2); color: var(--rust-orange); border: 1px solid rgba(205, 65, 43, 0.5); }

        .btn-logout {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-logout:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .main-content {
            flex: 1;
            padding: 30px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }

        .tabs {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .tab-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            padding: 10px 20px;
            position: relative;
            transition: color 0.3s;
        }

        .tab-btn:hover { color: white; }
        
        .tab-btn.active {
            color: var(--rust-orange);
        }

        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: -11px;
            left: 0;
            width: 100%;
            height: 3px;
            background-color: var(--rust-orange);
        }

        .tab-pane { display: none; }
        .tab-pane.active { display: block; }

        .panel-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 30px;
        }

        .panel-title {
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.5rem;
            margin-top: 0;
            margin-bottom: 20px;
            color: white;
        }

        /* Flex row for inputs */
        .flex-row {
            display: flex;
            gap: 15px;
            align-items: flex-end;
        }
        
        .flex-row .input-group { margin-bottom: 0; flex: 1; }
        .flex-row .btn { width: auto; white-space: nowrap; }

        /* Clip Preview */
        #clipPreview {
            display: none;
            margin-top: 20px;
            padding: 20px;
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .preview-content {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }

        .preview-img {
            width: 200px;
            border-radius: 6px;
            object-fit: cover;
        }

        .preview-details { flex: 1; }
        .preview-details p { margin: 5px 0; color: var(--text-muted); }
        .preview-details strong { color: white; }

        /* Tables */
        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.1rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        tr:hover td {
            background-color: rgba(255, 255, 255, 0.02);
        }

        .tb-thumb { width: 80px; border-radius: 4px; }
        .action-btns { display: flex; gap: 10px; }
        
        .btn-sm {
            padding: 6px 12px;
            font-size: 0.9rem;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
        }

        .btn-edit { background: #2b78cd; color: white; }
        .btn-edit:hover { background: #1e5a9c; }
        .btn-delete { background: #cd2b2b; color: white; }
        .btn-delete:hover { background: #9c1e1e; }
        .btn-save { background: #2bcd46; color: white; display: none; }

        .edit-input {
            width: 100%;
            background: rgba(0,0,0,0.5);
            border: 1px solid var(--rust-orange);
            color: white;
            padding: 5px;
            border-radius: 4px;
            display: none;
        }

        /* Notifications */
        .notification {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 15px 25px;
            border-radius: 6px;
            color: white;
            font-weight: 500;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s;
            z-index: 1000;
        }

        .notification.show { transform: translateY(0); opacity: 1; }
        .notif-success { background: #2bcd46; }
        .notif-error { background: #cd2b2b; }
        
        #ownerOnlyTab { display: none; }

        @media (max-width: 768px) {
            .flex-row { flex-direction: column; align-items: stretch; }
            .flex-row .btn { width: 100%; margin-top: 15px; }
            .preview-content { flex-direction: column; }
            .top-bar { padding: 15px; flex-direction: column; gap: 15px; }
            .main-content { padding: 15px; }
            table { display: block; overflow-x: auto; }
        }
    </style>
</head>
<body>

    <!-- Login Screen -->
    <div id="loginScreen">
        <div class="login-card">
            <div class="login-logo">KNGL RUST</div>
            <div class="login-title">Admin Girişi</div>
            
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="input-group">
                    <label for="username">Kullanıcı Adı</label>
                    <input type="text" id="username" class="input-control" required autocomplete="username">
                </div>
                
                <div class="input-group">
                    <label for="password">Şifre</label>
                    <input type="password" id="password" class="input-control" required autocomplete="current-password">
                </div>
                
                <button type="submit" class="btn" id="loginBtn">Giriş Yap</button>
                <div id="loginError" class="error-msg"></div>
            </form>
        </div>
    </div>

    <!-- Admin Dashboard -->
    <div id="adminDashboard">
        <div class="top-bar">
            <div class="top-logo">KNGL RUST</div>
            <div class="user-info">
                <span id="displayUsername">Admin</span>
                <span id="displayRole" class="role-badge role-admin">Admin</span>
                <button class="btn-logout" onclick="handleLogout()"><i class="fas fa-sign-out-alt"></i> Çıkış</button>
            </div>
        </div>

        <div class="main-content">
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('klipler')">Klipler</button>
                <button class="tab-btn" id="ownerOnlyTab" onclick="switchTab('kullanicilar')">Kullanıcılar</button>
            </div>

            <!-- Klipler Tab -->
            <div id="tab-klipler" class="tab-pane active">
                <div class="panel-card">
                    <h2 class="panel-title">Yeni Klip Ekle (Kick)</h2>
                    <div class="flex-row">
                        <div class="input-group">
                            <label for="clipUrl">Kick Klip URL'si</label>
                            <input type="url" id="clipUrl" class="input-control" placeholder="https://kick.com/kanal/clips/klip-id">
                        </div>
                        <button class="btn" onclick="fetchClipInfo()" id="fetchBtn">Bilgileri Çek</button>
                    </div>

                    <div id="clipPreview">
                        <h3 style="margin-top:0; font-family:'Rajdhani';">Klip Önizleme</h3>
                        <div class="preview-content">
                            <img id="prevThumb" class="preview-img" src="" alt="Thumbnail">
                            <div class="preview-details">
                                <div class="input-group">
                                    <label>Klip Başlığı</label>
                                    <input type="text" id="prevTitle" class="input-control">
                                </div>
                                <p><strong>Kanal:</strong> <span id="prevChannel"></span></p>
                                <p><strong>Süre:</strong> <span id="prevDuration"></span></p>
                                <p><strong>Tarih:</strong> <span id="prevDate"></span></p>
                                <button class="btn" onclick="addClip()" style="margin-top: 15px;">Klibi Ekle</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="panel-card">
                    <h2 class="panel-title">Mevcut Klipler</h2>
                    <table>
                        <thead>
                            <tr>
                                <th>Görsel</th>
                                <th>Başlık</th>
                                <th>Kanal</th>
                                <th>Süre</th>
                                <th>Görüntülenme</th>
                                <th>İşlemler</th>
                            </tr>
                        </thead>
                        <tbody id="clipsTableBody">
                            <!-- Populated via JS -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Kullanıcılar Tab (Owner Only) -->
            <div id="tab-kullanicilar" class="tab-pane">
                <div class="panel-card">
                    <h2 class="panel-title">Yeni Admin Oluştur</h2>
                    <form onsubmit="handleCreateUser(event)">
                        <div class="flex-row">
                            <div class="input-group">
                                <label for="newUsername">Kullanıcı Adı</label>
                                <input type="text" id="newUsername" class="input-control" required>
                            </div>
                            <div class="input-group">
                                <label for="newPassword">Şifre</label>
                                <input type="password" id="newPassword" class="input-control" required>
                            </div>
                            <button type="submit" class="btn">Oluştur</button>
                        </div>
                    </form>
                </div>

                <div class="panel-card">
                    <h2 class="panel-title">Yöneticiler</h2>
                    <table>
                        <thead>
                            <tr>
                                <th>Kullanıcı Adı</th>
                                <th>Rol</th>
                                <th>İşlemler</th>
                            </tr>
                        </thead>
                        <tbody id="usersTableBody">
                            <!-- Populated via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Notification Container -->
    <div id="notification" class="notification"></div>

    <script>
        const API_BASE = 'https://knglrust.onrender.com';
        let authToken = localStorage.getItem('kngl_admin_token');
        let currentUser = null;
        let currentFetchedClip = null;

        // Init
        document.addEventListener('DOMContentLoaded', () => {
            if (authToken) {
                verifyToken();
            }
        });

        // Notifications
        function showNotif(msg, isError = false) {
            const el = document.getElementById('notification');
            el.textContent = msg;
            el.className = 'notification ' + (isError ? 'notif-error' : 'notif-success') + ' show';
            setTimeout(() => {
                el.classList.remove('show');
            }, 3000);
        }

        // Auth Functions
        async function verifyToken() {
            try {
                const res = await fetch(`${API_BASE}/api/admin/me`, {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                
                if (res.ok) {
                    currentUser = await res.json();
                    showDashboard();
                } else {
                    handleLogout();
                }
            } catch (err) {
                console.error("Token verification failed", err);
                handleLogout();
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const errEl = document.getElementById('loginError');
            
            btn.disabled = true;
            btn.textContent = 'Giriş Yapılıyor...';
            errEl.textContent = '';

            try {
                const res = await fetch(`${API_BASE}/api/admin/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('username').value,
                        password: document.getElementById('password').value
                    })
                });

                const data = await res.json();

                if (res.ok) {
                    authToken = data.token;
                    localStorage.setItem('kngl_admin_token', authToken);
                    currentUser = data.user;
                    showDashboard();
                } else {
                    errEl.textContent = data.message || 'Giriş başarısız. Bilgileri kontrol edin.';
                }
            } catch (err) {
                errEl.textContent = 'Sunucuya bağlanılamadı.';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Giriş Yap';
            }
        }

        function handleLogout() {
            localStorage.removeItem('kngl_admin_token');
            authToken = null;
            currentUser = null;
            document.getElementById('adminDashboard').style.display = 'none';
            document.getElementById('loginScreen').style.display = 'flex';
            document.getElementById('loginForm').reset();
        }

        function showDashboard() {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('adminDashboard').style.display = 'flex';
            
            document.getElementById('displayUsername').textContent = currentUser.username;
            const roleEl = document.getElementById('displayRole');
            roleEl.textContent = currentUser.role;
            roleEl.className = `role-badge role-${currentUser.role}`;

            if (currentUser.role === 'owner') {
                document.getElementById('ownerOnlyTab').style.display = 'block';
                loadUsers();
            } else {
                document.getElementById('ownerOnlyTab').style.display = 'none';
            }

            loadClips();
        }

        // UI Tabs
        function switchTab(tabId) {
            document.querySelectorAll('.tab-pane').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById(`tab-${tabId}`).classList.add('active');
            event.target.classList.add('active');
        }

        // Format duration mm:ss
        function formatDuration(seconds) {
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m}:${s.toString().padStart(2, '0')}`;
        }

        // Clip Management
        async function fetchClipInfo() {
            const url = document.getElementById('clipUrl').value;
            if (!url) return showNotif('Lütfen bir URL girin', true);

            const btn = document.getElementById('fetchBtn');
            btn.disabled = true;
            btn.textContent = 'Çekiliyor...';

            try {
                const res = await fetch(`${API_BASE}/api/clips/fetch-info`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${authToken}`
                    },
                    body: JSON.stringify({ clipUrl: url })
                });

                const data = await res.json();
                
                if (res.ok) {
                    currentFetchedClip = data;
                    currentFetchedClip.clipUrl = url; // save original url
                    
                    document.getElementById('prevThumb').src = data.thumbnailUrl;
                    document.getElementById('prevTitle').value = data.title;
                    document.getElementById('prevChannel').textContent = data.channel;
                    document.getElementById('prevDuration').textContent = formatDuration(data.duration);
                    document.getElementById('prevDate').textContent = new Date(data.createdAt || Date.now()).toLocaleDateString('tr-TR');
                    
                    document.getElementById('clipPreview').style.display = 'block';
                } else {
                    showNotif(data.message || 'Klip bilgileri alınamadı', true);
                }
            } catch (err) {
                showNotif('Bağlantı hatası', true);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Bilgileri Çek';
            }
        }

        async function addClip() {
            if (!currentFetchedClip) return;
            
            const title = document.getElementById('prevTitle').value;
            
            try {
                const payload = {
                    title: title,
                    channel: currentFetchedClip.channel,
                    clipUrl: currentFetchedClip.clipUrl,
                    thumbnailUrl: currentFetchedClip.thumbnailUrl,
                    duration: currentFetchedClip.duration,
                    views: currentFetchedClip.views || 0,
                    creatorId: currentUser.id
                };

                const res = await fetch(`${API_BASE}/api/clips`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${authToken}`
                    },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    showNotif('Klip başarıyla eklendi');
                    document.getElementById('clipUrl').value = '';
                    document.getElementById('clipPreview').style.display = 'none';
                    currentFetchedClip = null;
                    loadClips();
                } else {
                    const data = await res.json();
                    showNotif(data.message || 'Klip eklenemedi', true);
                }
            } catch (err) {
                showNotif('Bağlantı hatası', true);
            }
        }

        async function loadClips() {
            try {
                const res = await fetch(`${API_BASE}/api/clips`, {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                
                if (res.ok) {
                    const clips = await res.json();
                    const tbody = document.getElementById('clipsTableBody');
                    tbody.innerHTML = '';
                    
                    clips.forEach(clip => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td><img src="${clip.thumbnailUrl}" class="tb-thumb"></td>
                            <td>
                                <span id="title-text-${clip.id}">${clip.title}</span>
                                <input type="text" id="title-input-${clip.id}" class="edit-input" value="${clip.title}">
                            </td>
                            <td>${clip.channel}</td>
                            <td>${formatDuration(clip.duration)}</td>
                            <td>${clip.views || 0}</td>
                            <td class="action-btns">
                                <button class="btn-sm btn-edit" id="btn-edit-${clip.id}" onclick="startEdit('${clip.id}')"><i class="fas fa-edit"></i></button>
                                <button class="btn-sm btn-save" id="btn-save-${clip.id}" onclick="saveEdit('${clip.id}')"><i class="fas fa-check"></i></button>
                                <button class="btn-sm btn-delete" onclick="deleteClip('${clip.id}')"><i class="fas fa-trash"></i></button>
                            </td>
                        `;
                        tbody.appendChild(tr);
                    });
                }
            } catch (err) {
                console.error("Failed to load clips", err);
            }
        }

        function startEdit(id) {
            document.getElementById(`title-text-${id}`).style.display = 'none';
            document.getElementById(`title-input-${id}`).style.display = 'block';
            document.getElementById(`btn-edit-${id}`).style.display = 'none';
            document.getElementById(`btn-save-${id}`).style.display = 'block';
        }

        async function saveEdit(id) {
            const newTitle = document.getElementById(`title-input-${id}`).value;
            
            try {
                const res = await fetch(`${API_BASE}/api/clips/${id}`, {
                    method: 'PUT',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${authToken}`
                    },
                    body: JSON.stringify({ title: newTitle })
                });

                if (res.ok) {
                    showNotif('Klip güncellendi');
                    loadClips();
                } else {
                    showNotif('Güncelleme başarısız', true);
                }
            } catch (err) {
                showNotif('Bağlantı hatası', true);
            }
        }

        async function deleteClip(id) {
            if(!confirm('Bu klibi silmek istediğinize emin misiniz?')) return;
            
            try {
                const res = await fetch(`${API_BASE}/api/clips/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });

                if (res.ok) {
                    showNotif('Klip silindi');
                    loadClips();
                } else {
                    showNotif('Silme başarısız', true);
                }
            } catch (err) {
                showNotif('Bağlantı hatası', true);
            }
        }

        // User Management (Owner Only)
        async function loadUsers() {
            try {
                const res = await fetch(`${API_BASE}/api/admin/users`, {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                
                if (res.ok) {
                    const users = await res.json();
                    const tbody = document.getElementById('usersTableBody');
                    tbody.innerHTML = '';
                    
                    users.forEach(u => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td>${u.username}</td>
                            <td><span class="role-badge role-${u.role}">${u.role}</span></td>
                            <td>
                                ${u.role !== 'owner' ? `<button class="btn-sm btn-delete" onclick="deleteUser('${u.id}')"><i class="fas fa-trash"></i></button>` : '-'}
                            </td>
                        `;
                        tbody.appendChild(tr);
                    });
                }
            } catch (err) {
                console.error("Failed to load users", err);
            }
        }

        async function handleCreateUser(e) {
            e.preventDefault();
            
            const username = document.getElementById('newUsername').value;
            const password = document.getElementById('newPassword').value;

            try {
                const res = await fetch(`${API_BASE}/api/admin/create-user`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${authToken}`
                    },
                    body: JSON.stringify({ username, password, role: 'admin' })
                });

                if (res.ok) {
                    showNotif('Kullanıcı başarıyla oluşturuldu');
                    e.target.reset();
                    loadUsers();
                } else {
                    const data = await res.json();
                    showNotif(data.message || 'Kullanıcı oluşturulamadı', true);
                }
            } catch (err) {
                showNotif('Bağlantı hatası', true);
            }
        }

        async function deleteUser(id) {
            if(!confirm('Bu kullanıcıyı silmek istediğinize emin misiniz?')) return;
            
            try {
                const res = await fetch(`${API_BASE}/api/admin/users/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });

                if (res.ok) {
                    showNotif('Kullanıcı silindi');
                    loadUsers();
                } else {
                    showNotif('Silme başarısız', true);
                }
            } catch (err) {
                showNotif('Bağlantı hatası', true);
            }
        }
    </script>
</body>
</html>
